[package]
name = "stake-blend"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stake_blend"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = {version = "0.31.1", features = ["stake"]}
solana-sysvar = "3.0.0"
spl-associated-token-account = "7.0.0"
spl-stake-pool = {version = "2.0.3", features = ["no-entrypoint"]}

